name: Stream Providers Health Check

on:
  schedule:
    - cron: '0 0 */3 * *' # يعمل تلقائياً كل 3 أيام
  workflow_dispatch: # يتيح لك تشغيله يدوياً بزر واحد عند الحاجة

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Health Check
        run: python health_check.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "HealthCheckBot"
          git config --global user.email "bot@github.com"
          git add config.json
          git commit -m "Auto-update config.json [skip ci]" || exit 0
          git push

